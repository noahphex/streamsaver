<!DOCTYPE html>
<!--
  email_reports/templates/base.html
  Streamsaver email report template — Dracula theme
  Author: Noah Lee

  Placeholders filled by report_builder.py:
    {{TITLE}}, {{PREHEADER}}, {{CONTENT}}, {{YEAR}}

  Compatibility: Gmail, Apple Mail, Outlook desktop/web, iOS Mail
  Layout: table-based only — no flexbox, grid, CSS variables, or external fonts
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; background-color: #1c1f2b; font-family: Arial, Helvetica, sans-serif; }
    img  { border: 0; display: block; }
    table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    h1, h2, h3, p { margin: 0; padding: 0; }
  </style>
</head>
<body bgcolor="#1c1f2b" style="margin:0;padding:0;background-color:#1c1f2b;">

  <!-- Preheader text (hidden, shown in email preview) -->
  <span style="display:none;font-size:1px;color:#1c1f2b;max-height:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;
  </span>

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1c1f2b"
    style="background-color:#1c1f2b;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!-- Container: max 620px -->
        <table width="620" cellpadding="0" cellspacing="0" border="0"
          style="max-width:620px;width:100%;background-color:#262a3a;border-radius:10px;
                 border:1px solid #3a3d52;">

          <!-- App header -->
          <tr>
            <td align="center" bgcolor="#262a3a"
              style="padding:28px 32px 22px;border-bottom:1px solid #3a3d52;
                     background-color:#262a3a;border-radius:10px 10px 0 0;">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:36px;
                         font-weight:700;color:#bd93f9;letter-spacing:1px;">
                Streamsaver
              </p>
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;
                         color:#6272a4;margin-top:6px;">
                Streaming cost intelligence
              </p>
            </td>
          </tr>

          <!-- Content injected by report_builder.py -->
          <tr>
            <td style="padding:28px 28px 8px;background-color:#262a3a;">
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" bgcolor="#1c1f2b"
              style="padding:16px 32px;background-color:#1c1f2b;
                     border-top:1px solid #3a3d52;border-radius:0 0 10px 10px;">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;
                         color:#6272a4;">
                Streamsaver &bull; Automated daily digest &bull; {{YEAR}}
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
