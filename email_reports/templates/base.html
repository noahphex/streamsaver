<!DOCTYPE html>
<!--
  email_reports/templates/base.html
  Streamsaver email report template — Dracula theme
  Author: Noah Lee

  Placeholders filled by report_builder.py:
    {{TITLE}}, {{PREHEADER}}, {{CONTENT}}, {{YEAR}}

  Compatibility: Gmail, Apple Mail, Outlook desktop/web, iOS Mail
  Layout: table-based only — no flexbox, grid, CSS variables, or external fonts
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    body  { margin: 0; padding: 0; background-color: #1e2230; font-family: Arial, Helvetica, sans-serif; }
    img   { border: 0; display: block; }
    table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    h1, h2, h3, p { margin: 0; padding: 0; }

    /* Mobile: stack logo below header text at narrow widths */
    @media (max-width: 480px) {
      .ss-info-col { display: block !important; width: 100% !important; padding-right: 0 !important; }
      .ss-logo-col { display: block !important; width: 100% !important; text-align: left !important; padding-top: 14px !important; }
      .ss-logo-box { margin: 0 !important; }
      .ss-container { padding: 16px !important; }
    }
  </style>
</head>
<body bgcolor="#1e2230" style="margin:0;padding:0;background-color:#1e2230;">

  <!-- Preheader (hidden preview text) -->
  <span style="display:none;font-size:1px;color:#1e2230;max-height:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;
  </span>

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1e2230"
    style="background-color:#1e2230;">
    <tr>
      <td align="center" style="padding:28px 12px;">

        <!-- Container: max 640px, rounded 24px -->
        <table width="640" cellpadding="0" cellspacing="0" border="0"
          style="max-width:640px;width:100%;background-color:#262a3a;border-radius:24px;
                 border:1px solid #3a3d52;">

          <!-- App header -->
          <tr>
            <td align="center" bgcolor="#262a3a"
              style="padding:42px 32px;border-bottom:1px solid #3a3d52;
                     background-color:#262a3a;border-radius:24px 24px 0 0;">
              {{HEADER_IMG}}
            </td>
          </tr>

          <!-- Content injected by report_builder.py -->
          <tr>
            <td class="ss-container" style="padding:28px 28px 12px;background-color:#262a3a;">
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" bgcolor="#1e2230"
              style="padding:16px 32px;background-color:#1e2230;
                     border-top:1px solid #3a3d52;border-radius:0 0 24px 24px;">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;
                         color:rgba(255,255,255,0.38);">
                Streamsaver &bull; Automated daily digest &bull; {{YEAR}}
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
