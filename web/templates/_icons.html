{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'refresh' %}<path d="M20 12a8 8 0 0 1-13.6 5.7M4 12a8 8 0 0 1 13.6-5.7"/><path d="M18 3v4h-4M6 21v-4h4"/>
  {% elif name == 'more' %}<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>
  {% elif name == 'home' %}<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>
  {% elif name == 'calendar' %}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>
  {% elif name == 'list' %}<path d="M5 6h14M5 12h14M5 18h9"/>
  {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'chevron-right' %}<path d="m9 5 7 7-7 7"/>
  {% elif name == 'chevron-left' %}<path d="m15 5-7 7 7 7"/>
  {% endif %}
</svg>
{%- endmacro %}
