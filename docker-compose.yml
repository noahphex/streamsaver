services:
  streamsaver:
    image: ghcr.io/noahphex/streamsaver:${STREAMSAVER_VERSION:-latest}
    # build: .
    environment:
      TZ: ${TZ:-UTC}
      STREAMSAVER_SECRET_KEY: ${STREAMSAVER_SECRET_KEY:-}
      STREAMSAVER_PASSPHRASE: ${STREAMSAVER_PASSPHRASE:-}
    ports:
      - "${STREAMSAVER_PORT:-8092}:8092"
    volumes:
      - config:/app/config
      - data:/app/data
      - logos:/app/assets/logos
      - backups:/app/backups
    restart: unless-stopped

  streamsaver-scheduler:
    image: ghcr.io/noahphex/streamsaver:${STREAMSAVER_VERSION:-latest}
    # build: .
    environment:
      TZ: ${TZ:-UTC}
      STREAMSAVER_PASSPHRASE: ${STREAMSAVER_PASSPHRASE:-}
    command: ["python", "scheduler.py", "--run-at", "${STREAMSAVER_SCHEDULER_RUN_AT:-02:00}"]
    volumes:
      - config:/app/config
      - data:/app/data
      - logos:/app/assets/logos
      - backups:/app/backups
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  config:
  data:
  logos:
  backups:
