---
services:
  streamsaver:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamsaver:v2.5
    container_name: streamsaver
    environment:
      - TZ=America/Chicago
      - STREAMSAVER_PORT=8092
      - STREAMSAVER_SECRET_KEY=${STREAMSAVER_SECRET_KEY:-change-me-local-streamsaver}
      - STREAMSAVER_PASSPHRASE=${STREAMSAVER_PASSPHRASE:-}
    ports:
      - "8092:8092"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./assets/logos:/app/assets/logos
      - ./backups:/app/backups
    restart: unless-stopped
    labels:
      - diun.enable=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
